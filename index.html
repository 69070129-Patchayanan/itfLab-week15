<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Picker ITF</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            background-color: #ff69b4;
            padding: 15px 0;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.3);
        }

        .container {
            background-color: #1a1a1a;
            border: 2px solid #ff69b4;
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.2);
        }

        .food-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #ff69b4;
            margin-bottom: 20px;
        }

        .food-name {
            font-size: 28px;
            color: #ff69b4;
            margin: 10px 0;
        }

        .food-desc {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 15px;
        }

        .food-price {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff3366;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .random-btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4);
        }

        .random-btn:hover {
            background-color: #ff3366;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="navbar">
        FOODPICKER
    </div>

    <div class="container">
        <img id="f-img" class="food-image" src="food.png" alt="Food Image">
        <h2 id="f-name" class="food-name">กดปุ่มเพื่อสุ่มอาหาร</h2>
        <p id="f-desc" class="food-desc">วันนี้กินอะไรดีนะ?</p>
        <div id="f-price" class="food-price">0 ฿</div>
        <br>
        <button class="random-btn" onclick="randomFood()">สุ่มเมนูอาหาร</button>
    </div>

    <script>
        const foods = [
            {
                name: "ข้าวมันไก่",
                desc: "เนื้อไก่นุ่มๆ ข้าวมันหอมกรุ่น พร้อมน้ำจิ้มรสเด็ด",
                price: "50 ฿",
                img: "chicken.png"
            },
            {
                name: "ผัดกะเพราหมูสับไข่ดาว",
                desc: "เมนูสิ้นคิดแต่อร่อย รสชาติจัดจ้าน หอมกลิ่นใบกะเพรา",
                price: "60 ฿",
                img: "krapow.png"
            },
            {
                name: "ต้มยำกุ้งน้ำข้น",
                desc: "รสชาติเปรี้ยวเผ็ดจัดจ้าน กุ้งตัวโต หอมเครื่องต้มยำ",
                price: "120 ฿",
                img: "tomyum.png"
            },
            {
                name: "ข้าวผัดหมู",
                desc: "ข้าวผัดร่วนๆ หอมกลิ่นกระทะ บีบมะนาวนิดหน่อยอร่อยมาก",
                price: "55 ฿",
                img: "pork.png"
            },
            {
                name: "ส้มตำไทย",
                desc: "เปรี้ยว หวาน เค็ม เผ็ด ครบรส มะละกอกรอบอร่อย",
                price: "45 ฿",
                img: "tumthai.png"
            }
        ];

        function randomFood() {
            const randomIndex = Math.floor(Math.random() * foods.length);
            const selectedFood = foods[randomIndex];

            document.getElementById("f-img").src = selectedFood.img;
            document.getElementById("f-name").innerText = selectedFood.name;
            document.getElementById("f-desc").innerText = selectedFood.desc;
            document.getElementById("f-price").innerText = selectedFood.price;
        }
    </script>
</body>
</html>
